name: Deploy to GitHub Pages

on:
  push:
  pull_request:
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions required by deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test-python:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run unit tests
        run: python -m unittest discover tests

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint, test-python]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Inject commit info into index.html
        run: |
          export COMMIT_HASH=$(git rev-parse --short HEAD)
          export COMMIT_TIME=$(git log -1 --format="%cd" --date=iso)
          export BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 -c "
          import os, re
          h = os.environ['COMMIT_HASH']
          t = os.environ['COMMIT_TIME']
          b = os.environ['BUILD_TIME']
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'<a\s+([^>]*?)href=\"https://github\.com/phargogh/pmccert-map-data-from-google-sheet/commit/[^\"]*\"([^>]*)>[^<]*</a>',
                           fr'<a \1href=\"https://github.com/phargogh/pmccert-map-data-from-google-sheet/commit/{h}\"\2>{h}</a>',
                           content)
          content = re.sub(r'(<(?:span|time)\s+id=\"commit-date\">)[^<]*(</(?:span|time)>)',
                           fr'\g<1>{t}\g<2>',
                           content)
          content = re.sub(r'(<(?:span|time)\s+id=\"build-date\">)[^<]*(</(?:span|time)>)',
                           fr'\g<1>{b}\g<2>',
                           content)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the repository root (index.html and addresses.json live here)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
